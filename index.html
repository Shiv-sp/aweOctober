<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harm Reduction Wordle 🎃</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <h1>🎃 Hallows Eve: Wordle 🍩</h1>
    <p>Guess the 5-letter word in 6 tries! (Halloween + Harm Reduction... Ask a CA for a hint!)</p>
    <div id="grid"></div>
    <div class="input-area">
      <input type="text" id="guessInput" maxlength="5" placeholder="Enter your guess..." />
      <button id="guessButton">Guess</button>
    </div>
    <div id="message"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
